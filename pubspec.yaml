name: newcomer_os
description: "Erstmal - a first-90-days checklist for international students arriving in Germany."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/roadmaps/
    - assets/roadmaps/de-students/
